
name: Regularly contacts

on:
  schedule:
    - cron: '0 */2 * * *'  # 每2小时一次（每天12次）

  # 允许在 GitHub 网页上手动点击运行，方便测试
  workflow_dispatch:

# 工作任务（jobs:）
jobs:
  # 定义一个名为 build 的工作任务.一个工作流可以包含多个任务，这里只有一个
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]  # 三个平台同时运行,每个系统都独立执行后面的步骤。

    steps:
      # 步骤1：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 步骤2：安装 Rust 工具链
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      # 步骤3：显示 Cargo 版本
      - name: Show Cargo version
        run: cargo --version
      
      # 步骤4：清理 Cargo 缓存
      - name: Clear cargo cache for this crate
        run: |
          # 删除特定 crate 的缓存（让下次构建必须重新下载）
          rm -rf ~/.cargo/registry/cache/github.com-*/chinese-validator-*
          rm -rf ~/.cargo/registry/src/github.com-*/chinese-validator-*
        continue-on-error: true  # 如果缓存不存在也不报错
      
      # 步骤5：构建项目
      - name: Build project
        run: cargo build --verbose
      
      # 步骤6：运行
      - name: Run project
        run: cargo run --verbose